<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Trader AI 6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --text-main: #e2e8f0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Vazirmatn', sans-serif; }
        .meter-container { width: 100%; height: 12px; background: #334155; border-radius: 6px; position: relative; overflow: hidden; }
        .meter-fill { height: 100%; position: absolute; transition: all 0.8s; }
        .meter-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; opacity: 0.5; }
        .card { background: var(--card-bg); border-radius: 1rem; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .data-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed #334155; }
        .ml-detail-row { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.2rem 0; }
        .skeleton { animation: pulse 1.5s infinite; background-color: #334155; border-radius: 4px; color: transparent !important; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <div class="lg:col-span-2 space-y-6">
        <div class="card p-4">
            <h1 class="text-2xl font-bold text-sky-400 mb-4 text-center">Pro Trader AI 6.0</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 items-end">
                <div>
                    <label class="text-xs text-slate-400">نماد</label>
                    <select id="symbol" class="w-full p-2 bg-slate-700 rounded text-sm" onchange="loadChart()">
                        <option value="EUR/USD" selected>EUR/USD</option>
                        <option value="BTC/USD">BTC/USD</option>
                        <option value="XAU/USD">XAU/USD</option>
                        <option value="GBP/USD">GBP/USD</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400">تایم‌فریم</label>
                    <select id="interval" class="w-full p-2 bg-slate-700 rounded text-sm" onchange="loadChart()">
                        <option value="15min">15 Min</option>
                        <option value="1h" selected>1 Hour</option>
                        <option value="4h">4 Hour</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400">کندل‌ها</label>
                    <input type="number" id="data_size" value="1000" class="w-full p-2 bg-slate-700 rounded text-sm text-center">
                </div>
                <button onclick="runAnalysis()" id="btn-analyze" class="h-9 bg-sky-600 hover:bg-sky-500 text-white rounded font-bold text-sm">
                    تحلیل ⚡
                </button>
            </div>
            <div class="mt-3 flex items-center gap-2">
                 <input type="checkbox" id="use_htf" checked class="h-4 w-4">
                 <label for="use_htf" class="text-xs text-slate-300">تاییدیه تایم بالا (HTF)</label>
            </div>
        </div>

        <div class="card h-[500px] overflow-hidden" id="chart-container"></div>
    </div>

    <div class="space-y-6">
        <div class="card p-6 text-center">
            <h2 class="text-lg font-bold text-slate-300 mb-2">سیگنال هوش مصنوعی</h2>
            <div id="signal-box" class="p-4 rounded-xl bg-slate-700 mb-4">
                <span id="signal-text" class="text-3xl font-black text-slate-400">---</span>
                <div id="ai-message" class="text-xs mt-2 text-slate-400">منتظر تحلیل...</div>
            </div>
            
            <div class="meter-container mb-1"><div class="meter-fill" id="meter-fill" style="width: 50%"></div><div class="meter-marker"></div></div>
            <div class="flex justify-between text-[10px] text-slate-500"><span>SELL (-10)</span><span>BUY (+10)</span></div>
            <div id="ai-val" class="font-mono font-bold text-lg mt-1">0.0</div>

            <div class="grid grid-cols-2 gap-2 mt-4">
                <div class="bg-red-900/30 p-2 rounded border border-red-500/30">
                    <div class="text-[10px] text-red-300">Stop Loss</div>
                    <div id="sl-val" class="font-mono font-bold text-red-400">---</div>
                </div>
                <div class="bg-green-900/30 p-2 rounded border border-green-500/30">
                    <div class="text-[10px] text-green-300">Take Profit</div>
                    <div id="tp-val" class="font-mono font-bold text-green-400">---</div>
                </div>
            </div>
        </div>

        <div class="card p-4 text-sm">
            <div class="data-row"><span class="text-slate-400">قیمت</span><span id="price-val" class="font-mono text-yellow-400">---</span></div>
            <div class="data-row"><span class="text-slate-400">روند (Trend)</span><span id="trend-val">---</span></div>
            <div class="data-row"><span class="text-slate-400">RSI</span><span id="rsi-val" class="font-mono">---</span></div>
            <div class="data-row"><span class="text-slate-400">MACD</span><span id="macd-val">---</span></div>
            <div class="data-row"><span class="text-slate-400">HTF Status</span><span id="htf-status-val" class="text-xs">---</span></div>
            <div class="data-row"><span class="text-slate-400">Divergence</span><span id="div-val">---</span></div>
            
            <div class="mt-4 pt-4 border-t border-slate-700">
                <p class="text-xs text-slate-500 mb-2">رأی مدل‌ها:</p>
                <div id="ml-individual-results" class="space-y-1"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
    const intervalMap = { "15min": "15", "1h": "60", "4h": "240" };
    
    // لود چارت هنگام باز شدن صفحه
    window.onload = () => loadChart();

    function loadChart() {
        const symbol = document.getElementById("symbol").value;
        const intervalKey = document.getElementById("interval").value;
        let tvSymbol = "FX_IDC:" + symbol.replace("/", "");
        if(symbol.includes("BTC")) tvSymbol = "BINANCE:BTCUSDT";
        else if(symbol.includes("XAU")) tvSymbol = "OANDA:XAUUSD";

        new TradingView.widget({
            "autosize": true,
            "symbol": tvSymbol,
            "interval": intervalMap[intervalKey],
            "timezone": "Asia/Tehran",
            "theme": "dark",
            "style": "1",
            "container_id": "chart-container",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "studies": ["RSI@tv-basicstudies", "MACD@tv-basicstudies"]
        });
    }

    async function runAnalysis() {
        const btn = document.getElementById("btn-analyze");
        btn.disabled = true; btn.innerText = "⏳ ...";
        applySkeleton(true);

        const payload = {
            symbol: document.getElementById("symbol").value,
            interval: document.getElementById("interval").value,
            use_htf: document.getElementById("use_htf").checked,
            size: parseInt(document.getElementById("data_size").value)
        };

        try {
            const res = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.error) throw new Error(data.error);
            updateDashboard(data);
        } catch(e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false; btn.innerText = "تحلیل ⚡";
            applySkeleton(false);
        }
    }

    function updateDashboard(data) {
        document.getElementById("price-val").innerText = data.price;
        document.getElementById("ai-val").innerText = data.score;
        document.getElementById("signal-text").innerText = data.signal.toUpperCase();
        document.getElementById("ai-message").innerText = data.indicators.ai_report.message;
        
        const box = document.getElementById("signal-box");
        if(data.signal === 'buy') box.className = "p-4 rounded-xl mb-4 bg-green-900/40 border border-green-500 text-green-400";
        else if(data.signal === 'sell') box.className = "p-4 rounded-xl mb-4 bg-red-900/40 border border-red-500 text-red-400";
        else box.className = "p-4 rounded-xl mb-4 bg-slate-700 text-slate-400";

        // Meter
        const pct = (data.score + 10) / 20 * 100;
        document.getElementById("meter-fill").style.width = `${pct}%`;
        document.getElementById("meter-fill").style.background = data.score > 0 ? '#4ade80' : (data.score < 0 ? '#f87171' : '#64748b');

        document.getElementById("sl-val").innerText = data.setup.sl;
        document.getElementById("tp-val").innerText = data.setup.tp;
        document.getElementById("trend-val").innerText = data.indicators.trend;
        document.getElementById("rsi-val").innerText = data.indicators.rsi.toFixed(1);
        document.getElementById("macd-val").innerText = data.indicators.macd;
        document.getElementById("htf-status-val").innerText = data.indicators.htf_status;
        document.getElementById("div-val").innerText = data.indicators.divergence;

        const mlContainer = document.getElementById("ml-individual-results");
        mlContainer.innerHTML = "";
        Object.entries(data.indicators.ai_report.individual_results).forEach(([k, v]) => {
             const color = v.score > 0 ? 'text-green-400' : (v.score < 0 ? 'text-red-400' : 'text-slate-400');
             mlContainer.innerHTML += `<div class="ml-detail-row"><span class="text-slate-400">${k}</span><span class="${color}">${v.prob}% (${v.score})</span></div>`;
        });
    }

    function applySkeleton(active) {
        const ids = ["price-val", "ai-val", "sl-val", "tp-val", "trend-val", "rsi-val", "macd-val"];
        ids.forEach(id => document.getElementById(id).classList.toggle("skeleton", active));
    }
</script>
</body>
</html>
